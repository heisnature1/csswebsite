<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>GTBank</title>
  <!-- Include your styles and other head elements -->
 </head>
 <body class="bg-gray-100">
  <!-- Existing content -->

  <!-- Login Form Example -->
  <div class="container mx-auto py-12">
    <div class="bg-white p-6 rounded-lg shadow-lg">
      <h2 class="text-center text-2xl text-gray-700 mb-4">Login</h2>
      <form id="loginForm">
        <div class="mb-4">
          <label for="username" class="block text-gray-600">Username</label>
          <input type="text" id="username" class="w-full p-2 border border-gray-300 rounded-lg" required/>
        </div>
        <div class="mb-4">
          <label for="password" class="block text-gray-600">Password</label>
          <input type="password" id="password" class="w-full p-2 border border-gray-300 rounded-lg" required/>
        </div>
        <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg">Login</button>
      </form>
    </div>
  </div>

  <!-- Existing content -->

  <!-- Add this JavaScript at the end of your body tag -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();  // Prevent the form from submitting

      // Capture the form data
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Log the captured credentials (for testing purposes)
      console.log("Username:", username);
      console.log("Password:", password);

      // You can also send the data to a server or handle it as needed
      // Example:
      // fetch('/your-endpoint', {
      //   method: 'POST',
      //   body: JSON.stringify({ username, password }),
      //   headers: { 'Content-Type': 'application/json' }
      // })
      // .then(response => response.json())
      // .then(data => console.log(data))
      // .catch(error => console.error('Error:', error));
    });
  </script>
 </body>
</html>
